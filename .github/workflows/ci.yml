# Repository CI.
# Only "CI Gate" is required by branch protection.
name: CI

# Spec-0023/T5: Check pull requests targeting main.
# Release branches are created from green main commits and do not receive PRs.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAGENTS_NO_SELF_UPDATE: "1"

jobs:
  nexau-pin:
    name: NexAU immutable dependency contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_nexau_dependency.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff check
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pytest
        run: |
          uv sync --locked --extra dev
          if [ -d tests ]; then
            uv run --locked --extra dev pytest tests/ -v
          else
            echo "No tests/ directory; skipping tests."
          fi

  desktop:
    name: Desktop checks (experimental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/desktop

  package:
    name: Wheel installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Install and run outside the checkout
        run: |
          uv venv /tmp/openagents-wheel --python 3.12
          uv pip install --python /tmp/openagents-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/openagents-wheel/bin/openagents --help
          /tmp/openagents-wheel/bin/spec --help

  nexau:
    name: Optional NexAU backend imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra nexau --extra dev
      - run: uv run --locked --extra nexau --extra dev python scripts/check_nexau_dependency.py --installed
      - run: uv run --locked --extra nexau --extra dev python -c "from nexau import Agent, AgentConfig; from openagents.backends.nexau import NexAUBackend"
      - name: Install the optional backend from wheels outside the checkout
        run: |
          wheel_dir="$RUNNER_TEMP/openagents-sdk-wheels"
          uv build --wheel --out-dir "$wheel_dir"
          uv venv "$RUNNER_TEMP/openagents-sdk-smoke" --python 3.12
          app_wheels=("$wheel_dir"/openagents-*.whl)
          uv pip install --python "$RUNNER_TEMP/openagents-sdk-smoke/bin/python" "${app_wheels[0]}[nexau]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/openagents-sdk-smoke/bin/python" -c "from nexau import Agent, AgentConfig; from openagents.backends.nexau import NexAUBackend"
          "$RUNNER_TEMP/openagents-sdk-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/check_nexau_dependency.py" --project "$GITHUB_WORKSPACE" --installed

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # Spec-0014/T5: Check Spec group numbers (decision D11).
  spec-conflicts:
    name: Spec Number Conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check spec number conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check-spec-number-conflicts.py \
            --open-prs \
            --require-open-pr-scan \
            --current-pr "${{ github.event.pull_request.number }}"

  # Spec-0014/T5: Validate Specs and check overview drift (decision D9).
  spec-validate:
    name: Spec Validate & Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate specs
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev spec validate --specs-root docs/specs

      - name: OVERVIEW drift check
        run: |
          uv run --locked --extra dev spec render --specs-root docs/specs
          git diff --exit-code docs/specs/OVERVIEW.md

      # Check module docstrings and the generated architecture view.
      - name: ARCHITECTURE drift + docstring check
        run: |
          uv run --locked --extra dev spec graph --specs-root docs/specs
          git diff --exit-code docs/specs/ARCHITECTURE.md
          uv run --locked --extra dev spec graph --specs-root docs/specs --check

  # Aggregate the checks into the required status.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [nexau-pin, lint, test, desktop, package, nexau, commitlint, spec-conflicts, spec-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "lint:           ${{ needs.lint.result }}"
          echo "test:           ${{ needs.test.result }}"
          echo "commitlint:     ${{ needs.commitlint.result }}"
          echo "spec-conflicts: ${{ needs.spec-conflicts.result }}"
          echo "spec-validate:  ${{ needs.spec-validate.result }}"

          results=(
            "${{ needs.nexau-pin.result }}"
            "${{ needs.desktop.result }}"
            "${{ needs.package.result }}"
            "${{ needs.nexau.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.test.result }}"
            "${{ needs.commitlint.result }}"
            "${{ needs.spec-conflicts.result }}"
            "${{ needs.spec-validate.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::CI failed — job result: $r"
              exit 1
            fi
          done
          echo "✓ All jobs passed or were correctly skipped"
