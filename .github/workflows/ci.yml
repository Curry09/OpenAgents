# CI 流水线（纯 Python 项目，由 north-coder CI 裁剪而来）
# 仅 "CI Gate" 作为分支保护的必需状态检查。
name: CI

# Spec-0023/T5：日常 PR 以 main 为 base；v2 compatibility PR 以 auto-designer/v0.2 为 base。
# release/vX.Y.Z 分支由已绿的 main 物化而来、不接 PR，无需在此重复门控。
on:
  pull_request:
    branches: [main, auto-designer/v0.2]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENAGENTS_NO_SELF_UPDATE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff check
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev ruff check .
          uv run --locked --extra dev ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pytest
        run: |
          uv sync --locked --extra dev
          if [ -d tests ]; then
            uv run --locked --extra dev pytest tests/ -v
          else
            echo "尚无 tests/ 目录，跳过"
          fi

  desktop:
    name: Desktop checks (experimental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/desktop
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/desktop

  package:
    name: Wheel installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Install and run outside the checkout
        run: |
          uv venv /tmp/openagents-wheel --python 3.12
          uv pip install --python /tmp/openagents-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/openagents-wheel/bin/openagents --help
          /tmp/openagents-wheel/bin/spec --help

  nexau:
    name: Optional NexAU backend imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra nexau --extra dev
      - run: uv run --locked --extra nexau --extra dev python -c "from nexau import Agent, AgentConfig; from openagents.backends.nexau import NexAUBackend"

  commitlint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # Spec-0014/T5：RFC 编号校验改为 spec 组编号校验（决策 D11）。
  spec-conflicts:
    name: Spec Number Conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check spec number conflicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/check-spec-number-conflicts.py \
            --open-prs \
            --require-open-pr-scan \
            --current-pr "${{ github.event.pull_request.number }}"

  # Spec-0014/T5：spec 校验 + OVERVIEW 幂等漂移检查（决策 D9）。
  spec-validate:
    name: Spec Validate & Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate specs
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev spec validate --specs-root docs/specs

      - name: OVERVIEW drift check
        run: |
          uv run --locked --extra dev spec render --specs-root docs/specs
          git diff --exit-code docs/specs/OVERVIEW.md

      # 2026-06-24 spec-markdown-form：需求① 现状映射。校验 docstring 规范齐全 + ARCHITECTURE 无漂移。
      - name: ARCHITECTURE drift + docstring check
        run: |
          uv run --locked --extra dev spec graph --specs-root docs/specs
          git diff --exit-code docs/specs/ARCHITECTURE.md
          uv run --locked --extra dev spec graph --specs-root docs/specs --check

  # --- 唯一的必需状态检查：聚合所有任务结果 ---
  ci-gate:
    name: CI Gate
    if: always()
    needs: [lint, test, desktop, package, nexau, commitlint, spec-conflicts, spec-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "lint:           ${{ needs.lint.result }}"
          echo "test:           ${{ needs.test.result }}"
          echo "commitlint:     ${{ needs.commitlint.result }}"
          echo "spec-conflicts: ${{ needs.spec-conflicts.result }}"
          echo "spec-validate:  ${{ needs.spec-validate.result }}"

          results=(
            "${{ needs.desktop.result }}"
            "${{ needs.package.result }}"
            "${{ needs.nexau.result }}"
            "${{ needs.lint.result }}"
            "${{ needs.test.result }}"
            "${{ needs.commitlint.result }}"
            "${{ needs.spec-conflicts.result }}"
            "${{ needs.spec-validate.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::CI failed — job result: $r"
              exit 1
            fi
          done
          echo "✓ All jobs passed or were correctly skipped"
