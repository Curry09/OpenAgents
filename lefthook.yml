# Git hooks configured according to CLAUDE.md

pre-commit:
  parallel: true
  commands:
    ruff-check:
      glob: "**/*.py"
      run: uv run --with ruff ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      glob: "**/*.py"
      run: uv run --with ruff ruff format {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}
