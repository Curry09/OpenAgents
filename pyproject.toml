[project]
name = "openagents"
version = "0.1.1"
description = "Spec-driven software delivery with coding agents"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
# Spec-0014/T1: The Spec CLI needs round-trip YAML and schema validation.
# ruamel.yaml preserves scalar styles and key order (decision D8).
# jsonschema validates Spec metadata and tasks against Draft 2020-12.
dependencies = [
    "ruamel.yaml>=0.18",
    "jsonschema>=4.0",
    # Spec-0069/T1：Generate shell completions from the argparse parser.
    # See the README for one-time registration.
    "argcomplete>=3.0",
]

[project.optional-dependencies]
nexau = [
    "nexau @ git+https://github.com/hzhua/nexau.git@28511d9f0362191a6c378fd441b2be55309a9e32",
    "ag-ui-protocol==0.1.22",
    "anthropic<1",
    # NexAU imports SQLAlchemy's asyncio engine even without an async DB driver.
    "greenlet>=3.0.0",
]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]

[project.scripts]
# RFC-0001 T1: CLI entry point
openagents = "openagents.cli:main"
# Spec-0014/T1: The Spec CLI has a separate entry point (decision D10).
spec = "openagents.spec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Let tests import the source package without a build.
pythonpath = ["."]
testpaths = ["tests"]

# Ruff settings follow the conventions in CLAUDE.md.
[tool.ruff]
line-length = 100
target-version = "py312"
# Exclude generated end-to-end evidence from source linting.
# Evidence files are not part of the source tree (Spec-0064/#162).
extend-exclude = ["docs/e2e-results/**"]

[tool.ruff.lint]
# E/F: pycodestyle and Pyflakes; I: import order; UP: pyupgrade.
# B: flake8-bugbear; ASYNC: blocking calls in async functions.
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # Line wrapping is handled by the formatter.

[tool.hatch.metadata]
allow-direct-references = true
