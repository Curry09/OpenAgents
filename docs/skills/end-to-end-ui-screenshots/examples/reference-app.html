<!DOCTYPE html>
<!--
  Spec-0044/T4: A standalone browser evidence example with no dependencies or requests.
  Click Apply configuration to observe a visible state change suitable for a screenshot.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reference app · Browser verification example</title>
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        max-width: 640px;
        margin: 48px auto;
        padding: 0 16px;
        color: #1a1a1a;
      }
      button {
        font-size: 16px;
        padding: 10px 20px;
        border: 1px solid #2563eb;
        background: #2563eb;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
      }
      #status {
        margin-top: 24px;
        font-size: 20px;
        font-weight: 600;
        color: #15803d;
        min-height: 28px;
      }
    </style>
  </head>
  <body>
    <h1>Configuration example</h1>
    <p>Apply the configuration and verify the status message.</p>
    <button id="apply" type="button">Apply configuration</button>
    <!-- The test ID lets browser automation inspect the live status. -->
    <div id="status" data-testid="status" role="status" aria-live="polite"></div>

    <script>
      // This state change does not make a network request.
      document.getElementById("apply").addEventListener("click", function () {
        document.getElementById("status").textContent = "Configuration applied";
      });
    </script>
  </body>
</html>
