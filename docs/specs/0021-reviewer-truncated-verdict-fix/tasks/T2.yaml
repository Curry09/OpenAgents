open-questions: |-
  - `MAX_REVIEW_RETRIES` 默认值(暂定 2)是否够:截断是随机的,2 次重评在多数情况下足以拿到可解析裁决;若实跑发现仍偏紧/偏松,可调该 env 默认。先按 2 上线,据 e2e 数据再校准。
  - 持续评审无效达上限后的收口选「_block 打 needs-human(reviewer 输出无法解析)」。若团队更希望「评审无效永不 block、只无限重评」,需接受极端持续截断下的 backend 成本——本组采前者(成本可控 + 诚实升级),此点留待人确认。
