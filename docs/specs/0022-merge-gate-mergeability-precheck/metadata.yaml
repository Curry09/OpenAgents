title: 代码闸可合并性预检 + poll 错误隔离 + 裁决评论幂等
issue: 62
slug: merge-gate-mergeability-precheck
summary: 不可合并的 PR（与 base 真冲突）进代码闸会让 merge_pr 抛错崩掉整轮 poll，并每轮重跑 reviewer、刷出大量重复 PASS 评论却永远合不进去。本组在进代码闸前先查 PR 可合并性：DIRTY/CONFLICTING 直接判 blocked + needs-human + 留一次「请手动 rebase」评论，不再反复评审；同时给 poll 加上单 PR 错误隔离（merge_pr 等失败不拖垮整轮），并让裁决评论幂等（同一裁决不每轮重发）。
